spring.application.name=LoanSaaS-Pro
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

spring.datasource.hikari.pool-name=LoanSaaS-Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ORIGINS:https://nobleloan-solutions.vercel.app}

app.frontend.url=${FRONTEND_URL:https://nobleloan-solutions.vercel.app}

# Public tenant resolution fallback for a single/default deployment.
# Set PUBLIC_TENANT_SLUG on Render; do not hardcode a tenant in Java code.
app.public.default-tenant-slug=${PUBLIC_TENANT_SLUG:}

# ============================================================
# OPENAPI / SWAGGER
# ============================================================

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus,flyway
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=LoanSaaS Pro
info.app.version=2.0.0

# ============================================================
# FILE UPLOADS
# ============================================================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# MAIL
# ============================================================

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}

# ============================================================
# SMILE ID - KYC / BIOMETRIC VERIFICATION
# ============================================================

app.smileid.enabled=${SMILEID_ENABLED:false}
app.smileid.sandbox=${SMILEID_SANDBOX:true}
app.smileid.partner-id=${SMILEID_PARTNER_ID:}
app.smileid.api-key=${SMILEID_API_KEY:}
app.smileid.callback-url=${SMILEID_CALLBACK_URL:}

# ============================================================
# MTN MOBILE MONEY
# ============================================================

mtn.momo.enabled=${MTN_MOMO_ENABLED:false}
mtn.momo.sandbox=${MTN_MOMO_SANDBOX:true}
mtn.momo.base-url=${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
mtn.momo.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
mtn.momo.api-user=${MTN_MOMO_API_USER:}
mtn.momo.api-key=${MTN_MOMO_API_KEY:}
mtn.momo.environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
mtn.momo.callback-url=${MTN_MOMO_CALLBACK_URL:}
mtn.momo.webhook-secret=${MTN_MOMO_WEBHOOK_SECRET:}

# ============================================================
# AIRTEL MONEY
# ============================================================

airtel.money.enabled=${AIRTEL_MONEY_ENABLED:false}
airtel.money.base-url=${AIRTEL_MONEY_BASE_URL:}
airtel.money.client-id=${AIRTEL_MONEY_CLIENT_ID:}
airtel.money.client-secret=${AIRTEL_MONEY_CLIENT_SECRET:}
airtel.money.api-key=${AIRTEL_MONEY_API_KEY:}
airtel.money.callback-url=${AIRTEL_MONEY_CALLBACK_URL:}
airtel.money.webhook-secret=${AIRTEL_MONEY_WEBHOOK_SECRET:}
airtel.money.country=${AIRTEL_MONEY_COUNTRY:RW}
airtel.money.currency=${AIRTEL_MONEY_CURRENCY:RWF}

# ============================================================
# FLUTTERWAVE
# ============================================================

flutterwave.enabled=${FLUTTERWAVE_ENABLED:false}
flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:}
flutterwave.base-url=https://api.flutterwave.com/v3
flutterwave.webhook-secret=${FLUTTERWAVE_WEBHOOK_SECRET:}

# ============================================================
# FX RATES
# ============================================================

app.openexchangerates.app-id=${OXR_APP_ID:}

# ============================================================
# LOGGING
# ============================================================

logging.level.com.patrick.fintech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ============================================================
# JACKSON
# ============================================================

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# ============================================================
# SMS NOTIFICATIONS
# ============================================================

app.sms.enabled=${SMS_ENABLED:false}

app.sms.africas-talking.api-key=${AT_API_KEY:}
app.sms.africas-talking.username=${AT_USERNAME:sandbox}
app.sms.africas-talking.sender-id=${AT_SENDER_ID:LoanSaaS}

app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ============================================================
# SCHEDULING
# ============================================================

app.scheduler.overdue-check-cron=${OVERDUE_CRON:0 0 7 * * *}
app.scheduler.fx-refresh-cron=${FX_REFRESH_CRON:0 0 2 * * *}

# ============================================================
# CREDIT BUREAU - REAL TRANSUNION ONLY
# ============================================================


app.credit-bureau.enabled=${CREDIT_BUREAU_ENABLED:false}

app.credit-bureau.provider=${CREDIT_BUREAU_PROVIDER:TransUnion}
app.credit-bureau.base-url=${CREDIT_BUREAU_BASE_URL:}
app.credit-bureau.api-key=${CREDIT_BUREAU_API_KEY:}
app.credit-bureau.simulation-enabled=false
app.credit-bureau.validity-days=30
app.credit-bureau.store-raw-response=false
app.credit-bureau.db-transaction-timeout-seconds=30


#app.credit-bureau.required-for-disbursement=${CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT:true}
app.credit-bureau.required-for-disbursement=${CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT:false}

# Production compliance: never silently treat the internal placeholder as a real sanctions result.
app.compliance.external-provider-enabled=${COMPLIANCE_EXTERNAL_PROVIDER_ENABLED:false}
app.compliance.provider=${COMPLIANCE_PROVIDER:}
app.compliance.base-url=${COMPLIANCE_BASE_URL:}
app.compliance.api-key=${COMPLIANCE_API_KEY:}
app.compliance.webhook-secret=${COMPLIANCE_WEBHOOK_SECRET:}
app.compliance.threshold=${COMPLIANCE_THRESHOLD:0.70}
app.compliance.include-adverse-media=${COMPLIANCE_INCLUDE_ADVERSE_MEDIA:true}
app.compliance.kyc-enabled=${COMPLIANCE_KYC_ENABLED:false}
app.compliance.kyc-provider=${COMPLIANCE_KYC_PROVIDER:LTGS}
app.compliance.kyc-base-url=${COMPLIANCE_KYC_BASE_URL:}
app.compliance.kyc-api-key=${COMPLIANCE_KYC_API_KEY:}
app.compliance.kyc-path=${COMPLIANCE_KYC_PATH:/api/}
# ============================================================
# APPLICATION ENVIRONMENT
# ============================================================


app.environment=${APP_ENVIRONMENT:development}

# ============================================================
# ASYNC THREAD POOL
# ============================================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

spring.task.scheduling.pool.size=4
# Production security: public self-registration is disabled by default.
app.auth.public-registration-enabled=${PUBLIC_REGISTRATION_ENABLED:false}

# Async import staging. In production use a persistent volume or object storage mount.
app.import.staging-dir=${IMPORT_STAGING_DIR:${java.io.tmpdir}/loansaas-imports}

# ============================================================
# FINANCIAL RECONCILIATION / MONITORING
# ============================================================

# Read-only reconciliation engine. Never disables accounting validation in production.
app.monitoring.reconciliation-enabled=${FINANCIAL_RECONCILIATION_ENABLED:true}
app.monitoring.reconciliation-interval-ms=${FINANCIAL_RECONCILIATION_INTERVAL_MS:300000}
app.monitoring.reconciliation-initial-delay-ms=${FINANCIAL_RECONCILIATION_INITIAL_DELAY_MS:60000}
app.monitoring.alert-cooldown-ms=${FINANCIAL_ALERT_COOLDOWN_MS:3600000}

# Distributed financial monitoring lock. Must exceed the worst-case reconciliation duration.
app.monitoring.reconciliation-lock-duration-ms=${FINANCIAL_RECONCILIATION_LOCK_DURATION_MS:900000}
