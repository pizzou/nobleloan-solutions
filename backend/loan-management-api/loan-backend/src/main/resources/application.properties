spring.application.name=LoanSaaS-Pro
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

spring.datasource.hikari.pool-name=LoanSaaS-Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ORIGINS:https://nobleloan-solutions.vercel.app}

app.frontend.url=${FRONTEND_URL:https://nobleloan-solutions.vercel.app}

# ============================================================
# OPENAPI / SWAGGER
# ============================================================

springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=LoanSaaS Pro
info.app.version=2.0.0

# ============================================================
# FILE UPLOADS
# ============================================================

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# MAIL
# ============================================================

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}

# ============================================================
# SMILE ID - KYC / BIOMETRIC VERIFICATION
# ============================================================

app.smileid.enabled=${SMILEID_ENABLED:false}
app.smileid.sandbox=${SMILEID_SANDBOX:true}
app.smileid.partner-id=${SMILEID_PARTNER_ID:}
app.smileid.api-key=${SMILEID_API_KEY:}
app.smileid.callback-url=${SMILEID_CALLBACK_URL:}

# ============================================================
# MTN MOBILE MONEY
# ============================================================

mtn.momo.enabled=${MTN_MOMO_ENABLED:false}
mtn.momo.sandbox=${MTN_MOMO_SANDBOX:false}
mtn.momo.base-url=${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
mtn.momo.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
mtn.momo.api-user=${MTN_MOMO_API_USER:}
mtn.momo.api-key=${MTN_MOMO_API_KEY:}
mtn.momo.environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
mtn.momo.callback-url=${MTN_MOMO_CALLBACK_URL:}

# ============================================================
# AIRTEL MONEY
# ============================================================

airtel.money.enabled=${AIRTEL_MONEY_ENABLED:false}
airtel.money.base-url=${AIRTEL_MONEY_BASE_URL:}
airtel.money.client-id=${AIRTEL_MONEY_CLIENT_ID:}
airtel.money.client-secret=${AIRTEL_MONEY_CLIENT_SECRET:}
airtel.money.api-key=${AIRTEL_MONEY_API_KEY:}
airtel.money.callback-url=${AIRTEL_MONEY_CALLBACK_URL:}
airtel.money.country=${AIRTEL_MONEY_COUNTRY:RW}
airtel.money.currency=${AIRTEL_MONEY_CURRENCY:RWF}

# ============================================================
# FLUTTERWAVE
# ============================================================

flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:}
flutterwave.base-url=https://api.flutterwave.com/v3
flutterwave.webhook-secret=${FLUTTERWAVE_WEBHOOK_SECRET:}

# ============================================================
# FX RATES
# ============================================================

app.openexchangerates.app-id=${OXR_APP_ID:}

# ============================================================
# LOGGING
# ============================================================

logging.level.com.patrick.fintech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ============================================================
# JACKSON
# ============================================================

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# ============================================================
# SMS NOTIFICATIONS
# ============================================================

app.sms.enabled=${SMS_ENABLED:false}

app.sms.africas-talking.api-key=${AT_API_KEY:}
app.sms.africas-talking.username=${AT_USERNAME:sandbox}
app.sms.africas-talking.sender-id=${AT_SENDER_ID:LoanSaaS}

app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ============================================================
# SCHEDULING
# ============================================================

app.scheduler.overdue-check-cron=${OVERDUE_CRON:0 0 7 * * *}
app.scheduler.fx-refresh-cron=${FX_REFRESH_CRON:0 0 2 * * *}

# ============================================================
# CREDIT BUREAU - REAL TRANSUNION ONLY
# ============================================================


app.credit-bureau.enabled=${CREDIT_BUREAU_ENABLED:false}

app.credit-bureau.provider=${CREDIT_BUREAU_PROVIDER:TransUnion}

# Leave empty until TransUnion gives you the real endpoint.
app.credit-bureau.base-url=${CREDIT_BUREAU_BASE_URL:}

# Leave the environment variable empty/unset until the real key
# is provided. The : default prevents Spring from crashing at
# application startup.
app.credit-bureau.api-key=${CREDIT_BUREAU_API_KEY:}

# NEVER use internal simulation.
app.credit-bureau.simulation-enabled=false

# Credit report validity period.
app.credit-bureau.validity-days=30

# Do not persist raw bureau responses by default.
app.credit-bureau.store-raw-response=false

# Database transaction timeout.
app.credit-bureau.db-transaction-timeout-seconds=30

# A production disbursement requires successful real Credit Bureau reporting.
# Set false only in development/testing or where the lender has a documented
# regulatory configuration that does not require bureau reporting.
app.credit-bureau.required-for-disbursement=${CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT:true}

# ============================================================
# APPLICATION ENVIRONMENT
# ============================================================


app.environment=${APP_ENVIRONMENT:development}

# ============================================================
# ASYNC THREAD POOL
# ============================================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

spring.task.scheduling.pool.size=4