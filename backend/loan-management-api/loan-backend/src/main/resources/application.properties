spring.application.name=LoanSaaS-Pro
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ======== FLYWAY MIGRATIONS ========
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ======== CONNECTION POOL (HikariCP) ========
spring.datasource.hikari.pool-name=LoanSaaS-Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ======== CORS ========
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost}

app.frontend.url=${FRONTEND_URL:https://fintech01-aydw.vercel.app}

# ======== OPENAPI ========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ======== ACTUATOR (health checks) ========
management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
info.app.name=LoanSaaS Pro
info.app.version=2.0.0


spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB


app.mail.enabled=${MAIL_ENABLED:false}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}

# ======== SMILE ID (KYC / biometric verification) ========
# sid-server: 0 = Sandbox (simulated results, safe for testing, no real
# document/AML checks), 1 = Production. Sandbox is free; Production bills
# per verification job. Get partner_id and api_key from your Smile ID portal.
app.smileid.enabled=${SMILEID_ENABLED:false}
app.smileid.sandbox=${SMILEID_SANDBOX:true}
app.smileid.partner-id=${SMILEID_PARTNER_ID:}
app.smileid.api-key=${SMILEID_API_KEY:}
app.smileid.callback-url=${SMILEID_CALLBACK_URL:}



# ============================================================
# PAYMENT TEST MODE
# ============================================================

# ============================================================
# MTN MOBILE MONEY - LOCAL SANDBOX TEST
# ============================================================

# ======== MTN MOBILE MONEY ========
mtn.momo.enabled=${MTN_MOMO_ENABLED:false}
mtn.momo.base-url=${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
mtn.momo.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
mtn.momo.api-user=${MTN_MOMO_API_USER:}
mtn.momo.api-key=${MTN_MOMO_API_KEY:}
mtn.momo.environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
mtn.momo.callback-url=${MTN_MOMO_CALLBACK_URL:}

# ======== FLUTTERWAVE ========
flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:}
flutterwave.base-url=https://api.flutterwave.com/v3
# Set this to the same "Secret Hash" configured in your Flutterwave dashboard's webhook settings —
# it's how we verify a webhook call genuinely came from Flutterwave and not an attacker.
flutterwave.webhook-secret=${FLUTTERWAVE_WEBHOOK_SECRET:}

# ======== FX RATES ========
app.openexchangerates.app-id=${OXR_APP_ID:}

# ======== LOGGING ========
# Log format/output is now controlled by logback-spring.xml (JSON in prod, plain console in
# dev) so it can attach the request ID from RequestIdFilter to every line. logging.level.*
# below still applies on top of that regardless of profile.
logging.level.com.patrick.fintech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ======== JACKSON (prevents ByteBuddyInterceptor serialization error) ========
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# ======== SMS NOTIFICATIONS ========
app.sms.enabled=${SMS_ENABLED:false}
app.sms.africas-talking.api-key=${AT_API_KEY:}
app.sms.africas-talking.username=${AT_USERNAME:sandbox}
app.sms.africas-talking.sender-id=${AT_SENDER_ID:LoanSaaS}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ======== SCHEDULING ========
app.scheduler.overdue-check-cron=${OVERDUE_CRON:0 0 7 * * *}
app.scheduler.fx-refresh-cron=${FX_REFRESH_CRON:0 0 2 * * *}

# ======== CREDIT BUREAU ========
# When disabled (default), checks are answered by a deterministic internal
# estimate derived from the borrower's own profile — no external call is made.
# Point this at a real BNR-licensed CRB (e.g. TransUnion Rwanda) in production.
app.credit-bureau.enabled=${CREDIT_BUREAU_ENABLED:false}
app.credit-bureau.provider=${CREDIT_BUREAU_PROVIDER:INTERNAL_SIMULATED}
app.credit-bureau.base-url=${CREDIT_BUREAU_BASE_URL:}
app.credit-bureau.api-key=${CREDIT_BUREAU_API_KEY:}

# ======== ASYNC THREAD POOL ========
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=4

# ======== JACKSON ========