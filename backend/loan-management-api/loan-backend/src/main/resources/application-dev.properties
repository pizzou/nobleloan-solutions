# DEV PROFILE — uses H2 in-memory (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:loansaasdev;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
logging.level.com.patrick.fintech=DEBUG
logging.level.org.springframework.security=DEBUG
# Dev-only signing key (never used for staging/prod — those require JWT_SECRET to be set,
# see application.properties). Fine to be predictable here since dev runs on H2 in-memory
# with no real borrower data.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-key-do-not-use-in-any-real-deployment-min-64-bytes-required}

# Local browser access for the frontend and its session cookies.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${app.cors.allowed-origins}}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
