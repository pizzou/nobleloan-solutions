# Isolated local audit stack. Never use this file with the production project.
# Requires Docker Compose v2.24+ for !override. It has its own project-scoped
# volumes/network, unique container names and a loopback-only HTTP port.
services:
  postgres:
    container_name: nobleloan-audit-postgres

  db-role-bootstrap:
    container_name: nobleloan-audit-db-role-bootstrap
    volumes: !override
      - ./deploy/audit/bank-grade-roles-fresh-db.sql:/scripts/bank-grade-roles.sql:ro

  backend:
    container_name: nobleloan-audit-backend
    environment:
      APP_ENVIRONMENT: staging
      MAIL_ENABLED: "false"
      BREVO_API_KEY: AUDIT_ONLY_MAIL_DISABLED
      AUTH_COOKIE_SECURE: "false"
      CREDIT_BUREAU_ENABLED: "false"
      CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT: "true"
      SMS_ENABLED: "false"
      COMPLIANCE_EXTERNAL_PROVIDER_ENABLED: "false"
      FLUTTERWAVE_ENABLED: "false"
      MTN_MOMO_ENABLED: "false"
      AIRTEL_MONEY_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "10000"
      LOANSAAS_ASYNC_CORE_POOL_SIZE: "2"
      LOANSAAS_ASYNC_MAX_POOL_SIZE: "4"
      LOANSAAS_ASYNC_QUEUE_CAPACITY: "50"
      SERVER_TOMCAT_THREADS_MAX: "40"

  frontend:
    container_name: nobleloan-audit-frontend

  nginx:
    container_name: nobleloan-audit-nginx
    ports: !override
      - "127.0.0.1:18080:80"
    volumes: !override
      - ./deploy/audit/nginx-conf:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  certbot:
    container_name: nobleloan-audit-certbot
