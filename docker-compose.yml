# ============================================================
# FINOS / LOANSAAS PRO
# SINGLE-TENANT PRODUCTION DEPLOYMENT
# AOS RWANDA
#
# Institution:
#   Noble Loan Solutions Ltd.
#
# Architecture:
#
#   Internet
#       |
#       v
#   Nginx :80/:443
#       |
#       +----> frontend :3000
#       |
#       +----> backend :8080
#                    |
#                    v
#               PostgreSQL :5432
#
# PostgreSQL is NOT exposed publicly.
# Backend and frontend are only reachable through the
# internal Docker network.
# ============================================================

services:
  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: loansaas-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: loansaas_nobleloansolutions
      POSTGRES_USER: loansaas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U loansaas -d loansaas_nobleloansolutions"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - loansaas-network

  # ==========================================================
  # SPRING BOOT BACKEND
  # ==========================================================

  backend:
    build:
      context: ./backend/loan-management-api/loan-backend
      dockerfile: Dockerfile

    container_name: loansaas-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # ------------------------------------------------------
      # SPRING
      # ------------------------------------------------------

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-default}

      # ------------------------------------------------------
      # DATABASE
      # ------------------------------------------------------

      DB_URL: jdbc:postgresql://postgres:5432/loansaas_nobleloansolutions
      DB_USERNAME: loansaas
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: loansaas_nobleloansolutions

      # ------------------------------------------------------
      # SINGLE TENANT
      # ------------------------------------------------------

      SEED_ORG: ${BOOTSTRAP_ORG_SLUG:-nobleloansolutions}
      BOOTSTRAP_ORG_SLUG: ${BOOTSTRAP_ORG_SLUG:-nobleloansolutions}
      BOOTSTRAP_ORG_PUBLIC_DOMAIN: ${BOOTSTRAP_ORG_PUBLIC_DOMAIN:-nobleloansolutions.rw}

      # ------------------------------------------------------
      # PRODUCTION ADMIN
      # ------------------------------------------------------

      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?BOOTSTRAP_ADMIN_NAME is required}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:?BOOTSTRAP_ADMIN_PHONE is required}

      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:?BOOTSTRAP_ORG_NAME is required}
      BOOTSTRAP_ORG_COUNTRY: ${BOOTSTRAP_ORG_COUNTRY:-RW}
      BOOTSTRAP_ORG_CURRENCY: ${BOOTSTRAP_ORG_CURRENCY:-RWF}
      BOOTSTRAP_ORG_TIMEZONE: ${BOOTSTRAP_ORG_TIMEZONE:-Africa/Kigali}
      BOOTSTRAP_ORG_LOCALE: ${BOOTSTRAP_ORG_LOCALE:-en-RW}
      BOOTSTRAP_ORG_WEBSITE: ${BOOTSTRAP_ORG_WEBSITE:?BOOTSTRAP_ORG_WEBSITE is required}
      BOOTSTRAP_ORG_CONTACT_EMAIL: ${BOOTSTRAP_ORG_CONTACT_EMAIL:?BOOTSTRAP_ORG_CONTACT_EMAIL is required}
      BOOTSTRAP_ORG_CONTACT_PHONE: ${BOOTSTRAP_ORG_CONTACT_PHONE:?BOOTSTRAP_ORG_CONTACT_PHONE is required}
      BOOTSTRAP_ORG_ADDRESS: ${BOOTSTRAP_ORG_ADDRESS:?BOOTSTRAP_ORG_ADDRESS is required}
      BOOTSTRAP_ORG_REGISTRATION_NUMBER: ${BOOTSTRAP_ORG_REGISTRATION_NUMBER:?BOOTSTRAP_ORG_REGISTRATION_NUMBER is required}

      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}

      # ------------------------------------------------------
      # AUTHENTICATION
      # ------------------------------------------------------

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}

      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}

      # ------------------------------------------------------
      # CORS
      # ------------------------------------------------------

      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:?WEBSOCKET_ALLOWED_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PUBLIC_TENANT_SLUG: ${PUBLIC_TENANT_SLUG:-nobleloansolutions}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}

      # ------------------------------------------------------
      # APPLICATION ENCRYPTION
      # ------------------------------------------------------

      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}

      APP_INDEX_KEY: ${APP_INDEX_KEY:?APP_INDEX_KEY is required}

      # ------------------------------------------------------
      # LOGGING
      # ------------------------------------------------------

      LOG_FILE: /var/log/loansaas/nobleloansolutions.log

      # ------------------------------------------------------
      # EMAIL
      # ------------------------------------------------------

      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Noble Loan Solution}
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY is required}

      # ------------------------------------------------------
      # FLUTTERWAVE
      # ------------------------------------------------------

      FLUTTERWAVE_ENABLED: ${FLUTTERWAVE_ENABLED:-false}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}

      # ------------------------------------------------------
      # MTN MOBILE MONEY
      # ------------------------------------------------------

      MTN_MOMO_ENABLED: ${MTN_MOMO_ENABLED:-false}
      MTN_MOMO_SANDBOX: ${MTN_MOMO_SANDBOX:-false}
      MTN_MOMO_BASE_URL: ${MTN_MOMO_BASE_URL:-}
      MTN_MOMO_SUBSCRIPTION_KEY: ${MTN_MOMO_SUBSCRIPTION_KEY:-}
      MTN_MOMO_API_USER: ${MTN_MOMO_API_USER:-}
      MTN_MOMO_API_KEY: ${MTN_MOMO_API_KEY:-}
      MTN_MOMO_CALLBACK_URL: ${MTN_MOMO_CALLBACK_URL:-}
      MTN_MOMO_WEBHOOK_SECRET: ${MTN_MOMO_WEBHOOK_SECRET:-}

      # ------------------------------------------------------
      # AIRTEL MONEY
      # ------------------------------------------------------

      AIRTEL_MONEY_ENABLED: ${AIRTEL_MONEY_ENABLED:-false}
      AIRTEL_MONEY_BASE_URL: ${AIRTEL_MONEY_BASE_URL:-}
      AIRTEL_MONEY_CLIENT_ID: ${AIRTEL_MONEY_CLIENT_ID:-}
      AIRTEL_MONEY_CLIENT_SECRET: ${AIRTEL_MONEY_CLIENT_SECRET:-}
      AIRTEL_MONEY_API_KEY: ${AIRTEL_MONEY_API_KEY:-}
      AIRTEL_MONEY_CALLBACK_URL: ${AIRTEL_MONEY_CALLBACK_URL:-}
      AIRTEL_MONEY_WEBHOOK_SECRET: ${AIRTEL_MONEY_WEBHOOK_SECRET:-}

      # ------------------------------------------------------
      # CREDIT BUREAU
      # ------------------------------------------------------

      CREDIT_BUREAU_ENABLED: ${CREDIT_BUREAU_ENABLED:-false}
      CREDIT_BUREAU_BASE_URL: ${CREDIT_BUREAU_BASE_URL:-}
      CREDIT_BUREAU_API_KEY: ${CREDIT_BUREAU_API_KEY:-}
      CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT: ${CREDIT_BUREAU_REQUIRED_FOR_DISBURSEMENT:-true}
      CREDIT_BUREAU_PROVIDER: ${CREDIT_BUREAU_PROVIDER:-TransUnion}

      # ------------------------------------------------------
      # COMPLIANCE PROVIDER
      # ------------------------------------------------------

      COMPLIANCE_EXTERNAL_PROVIDER_ENABLED: ${COMPLIANCE_EXTERNAL_PROVIDER_ENABLED:-false}
      COMPLIANCE_PROVIDER: ${COMPLIANCE_PROVIDER:-}
      COMPLIANCE_BASE_URL: ${COMPLIANCE_BASE_URL:-}
      COMPLIANCE_API_KEY: ${COMPLIANCE_API_KEY:-}
      COMPLIANCE_WEBHOOK_SECRET: ${COMPLIANCE_WEBHOOK_SECRET:-}

      # ------------------------------------------------------
      # PROVISIONING
      # ------------------------------------------------------

      PROVISIONING_POLICY_APPROVED: ${PROVISIONING_POLICY_APPROVED:-false}

      PROVISION_RATE_CURRENT: ${PROVISION_RATE_CURRENT:-0}
      PROVISION_RATE_WATCH: ${PROVISION_RATE_WATCH:-0}
      PROVISION_RATE_SUBSTANDARD: ${PROVISION_RATE_SUBSTANDARD:-0}
      PROVISION_RATE_DOUBTFUL: ${PROVISION_RATE_DOUBTFUL:-0}
      PROVISION_RATE_WRITTEN_OFF: ${PROVISION_RATE_WRITTEN_OFF:-0}

      # ------------------------------------------------------
      # FX
      # ------------------------------------------------------

      OXR_APP_ID: ${OXR_APP_ID:-}

      # ------------------------------------------------------
      # SMS (at least one complete production provider)
      # ------------------------------------------------------

      SMS_ENABLED: ${SMS_ENABLED:?SMS_ENABLED is required}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

      # ------------------------------------------------------
      # PRODUCTION EVIDENCE GATES
      # ------------------------------------------------------

      PROD_GATE_PENTEST_APPROVED: ${PROD_GATE_PENTEST_APPROVED:-false}
      PROD_GATE_IDOR_AUDIT_APPROVED: ${PROD_GATE_IDOR_AUDIT_APPROVED:-false}
      PROD_GATE_CORS_VERIFIED: ${PROD_GATE_CORS_VERIFIED:-false}
      PROD_GATE_SECRET_MANAGER_CONFIGURED: ${PROD_GATE_SECRET_MANAGER_CONFIGURED:-false}
      PROD_GATE_BNR_LICENSE_CONFIRMED: ${PROD_GATE_BNR_LICENSE_CONFIRMED:-false}
      PROD_GATE_REGULATION_MAPPING_APPROVED: ${PROD_GATE_REGULATION_MAPPING_APPROVED:-false}
      PROD_GATE_LEGAL_DISCLOSURES_APPROVED: ${PROD_GATE_LEGAL_DISCLOSURES_APPROVED:-false}
      PROD_GATE_PENALTY_POLICY_APPROVED: ${PROD_GATE_PENALTY_POLICY_APPROVED:-false}
      PROD_GATE_DPO_REGISTERED: ${PROD_GATE_DPO_REGISTERED:-false}
      PROD_GATE_DPO_APPOINTED: ${PROD_GATE_DPO_APPOINTED:-false}
      PROD_GATE_RECORDS_PROCESSING_APPROVED: ${PROD_GATE_RECORDS_PROCESSING_APPROVED:-false}
      PROD_GATE_DPIA_APPROVED: ${PROD_GATE_DPIA_APPROVED:-false}
      PROD_GATE_RETENTION_APPROVED: ${PROD_GATE_RETENTION_APPROVED:-false}
      PROD_GATE_BREACH_PLAN_APPROVED: ${PROD_GATE_BREACH_PLAN_APPROVED:-false}
      PROD_GATE_BACKUP_RESTORE_DRILL_APPROVED: ${PROD_GATE_BACKUP_RESTORE_DRILL_APPROVED:-false}
      PROD_GATE_POSTGRES_HA_APPROVED: ${PROD_GATE_POSTGRES_HA_APPROVED:-false}
      PROD_GATE_UPTIME_MONITORING_APPROVED: ${PROD_GATE_UPTIME_MONITORING_APPROVED:-false}
      PROD_GATE_CENTRAL_ALERTING_APPROVED: ${PROD_GATE_CENTRAL_ALERTING_APPROVED:-false}
      PROD_GATE_ACCOUNTING_CLOSE_APPROVED: ${PROD_GATE_ACCOUNTING_CLOSE_APPROVED:-false}
      PROD_GATE_COA_APPROVED: ${PROD_GATE_COA_APPROVED:-false}
      PROD_GATE_BANK_RECON_APPROVED: ${PROD_GATE_BANK_RECON_APPROVED:-false}
      PROD_GATE_SUBLEDGER_RECON_APPROVED: ${PROD_GATE_SUBLEDGER_RECON_APPROVED:-false}
      PROD_GATE_REVENUE_POLICY_APPROVED: ${PROD_GATE_REVENUE_POLICY_APPROVED:-false}
      PROD_GATE_GOLDEN_SCENARIOS_APPROVED: ${PROD_GATE_GOLDEN_SCENARIOS_APPROVED:-false}
      PROD_GATE_CONCURRENCY_TESTED: ${PROD_GATE_CONCURRENCY_TESTED:-false}
      PROD_GATE_PRODUCTION_POSTGRES_TESTED: ${PROD_GATE_PRODUCTION_POSTGRES_TESTED:-false}
      PROD_GATE_REGULATORY_GOLDEN_APPROVED: ${PROD_GATE_REGULATORY_GOLDEN_APPROVED:-false}

      # ------------------------------------------------------
      # FINANCIAL RECONCILIATION
      # ------------------------------------------------------

      FINANCIAL_RECONCILIATION_LOCK_DURATION_MS: ${FINANCIAL_RECONCILIATION_LOCK_DURATION_MS:-900000}

      # Keep production API documentation and local H2 surfaces disabled.
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      EXPOSE_H2: ${EXPOSE_H2:-false}

    volumes:
      - backend_logs:/var/log/loansaas

    networks:
      - loansaas-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/actuator/health/readiness",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==========================================================
  # NEXT.JS FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend/loan-management-ui
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}

    container_name: loansaas-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_TENANT_SLUG: ${BOOTSTRAP_ORG_SLUG:-nobleloansolutions}

      # Internal server-side backend address.
      # This is NOT exposed to the browser.
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080/api}

    networks:
      - loansaas-network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: nginx:1.27-alpine

    container_name: loansaas-nginx

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx configuration
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

      # Optional manually managed certificates
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro

      # Let's Encrypt webroot
      - certbot_www:/var/www/certbot:ro

      # Let's Encrypt certificates
      - certbot_certs:/etc/letsencrypt:ro

      # Nginx logs
      - nginx_logs:/var/log/nginx

    networks:
      - loansaas-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --no-check-certificate https://127.0.0.1/healthz | grep -q 'UP'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================
  # CERTBOT
  # ==========================================================

  certbot:
    image: certbot/certbot:v5.1.0

    container_name: loansaas-certbot

    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      - ./docker/nginx/ssl:/etc/nginx/ssl

    profiles:
      - ssl

# ============================================================
# PERSISTENT STORAGE
# ============================================================

volumes:
  postgres_data:
    driver: local

  backend_logs:
    driver: local

  nginx_logs:
    driver: local

  certbot_www:
    driver: local

  certbot_certs:
    driver: local

# ============================================================
# INTERNAL NETWORK
# ============================================================

networks:
  loansaas-network:
    driver: bridge
