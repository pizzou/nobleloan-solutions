
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 100"
  width="500"
  height="100"
  role="img"
  aria-labelledby="logoTitle logoDesc"
>
  <title id="logoTitle">Noble Loan Solutions</title>
  <desc id="logoDesc">
    Noble Loan Solutions — Financial Support Partner
  </desc>

  <!-- =====================================================
       GOLDEN SHIELD
       ===================================================== -->

  <g transform="translate(10 7)">

    <!-- Outer shield -->
    <path
      d="M40 5
         Q70 5 75 10
         Q80 50 40 85
         Q0 50 5 10
         Q10 5 40 5Z"
      fill="none"
      stroke="#D4AF37"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Inner shield -->
    <path
      d="M40 10
         Q66 10 70 14
         Q74 48 40 78
         Q6 48 10 14
         Q14 10 40 10Z"
      fill="none"
      stroke="#D4AF37"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Noble N -->
    <text
      x="40"
      y="59"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="46"
      font-weight="700"
      fill="#D4AF37"
    >N</text>

  </g>

  <!-- =====================================================
       COMPANY NAME
       ===================================================== -->

  <text
    x="110"
    y="52"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="800"
    fill="#0D2C54"
    letter-spacing="0.5"
  >NOBLE</text>

  <text
    x="215"
    y="52"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="300"
    fill="#0D2C54"
    letter-spacing="0.5"
  >LOAN SOLUTIONS</text>

  <!-- =====================================================
       TAGLINE
       ===================================================== -->

  <text
    x="112"
    y="76"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#D4AF37"
    letter-spacing="2"
  >FINANCIAL SUPPORT PARTNER</text>

</svg>
