# Run from the repository root: docker compose -f docker-compose.dev.yml up --build
name: nobleloan-dev

services:
  backend:
    build:
      context: ./backend/loan-management-api/loan-backend
      args:
        MAVEN_PROFILE: dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_ENVIRONMENT: development
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set a local bootstrap admin email}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set a local bootstrap admin password}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend/loan-management-ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
