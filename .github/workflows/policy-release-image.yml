name: Policy backend release image

on:
  pull_request:
    branches:
      - security/nextjs-15.5.28
    paths:
      - 'backend/loan-management-api/loan-backend/**'
      - '.github/workflows/policy-release-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/loan-management-api/loan-backend
          file: backend/loan-management-api/loan-backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/pizzou/nobleloan-solutions-backend:policy-${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
