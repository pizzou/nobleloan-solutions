groups:
  - name: noble-loan-production
    rules:
      - alert: NobleLoanBackendDown
        expr: up{job="noble-loan-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Noble Loan backend is unavailable"
          description: "Prometheus cannot scrape the production backend for more than 2 minutes."

      - alert: NobleLoanReadinessDown
        expr: probe_success{job="noble-loan-https"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Noble Loan external HTTPS check failed"
          description: "The external synthetic monitor cannot reach the production API."

      - alert: NobleLoanFinancialReconciliationFailed
        expr: loansaas_financial_reconciliation_failed_organizations > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Financial reconciliation failure"
          description: "At least one organization has a financial reconciliation failure. Investigate before corrective posting."

      - alert: NobleLoanFinancialReconciliationDifference
        expr: loansaas_financial_reconciliation_max_difference >= 0.01
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Financial reconciliation difference detected"
          description: "The latest reconciliation has a financial difference of at least 0.01."

      - alert: NobleLoanReconciliationStale
        expr: loansaas_financial_reconciliation_last_success_epoch_seconds > 0 and (time() - loansaas_financial_reconciliation_last_success_epoch_seconds) > 900
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Financial reconciliation is stale"
          description: "No successful financial reconciliation has completed in more than 15 minutes."

      - alert: NobleLoanReconciliationNeverSucceeded
        expr: loansaas_financial_reconciliation_last_success_epoch_seconds == 0 and up{job="noble-loan-backend"} == 1
        for: 20m
        labels: { severity: critical }
        annotations:
          summary: "Financial reconciliation has never succeeded"
          description: "The backend is up but no successful reconciliation has been recorded."

      - alert: NobleLoanHighHttp5xxRate
        expr: rate(http_server_requests_seconds_count{job="noble-loan-backend",status=~"5.."}[5m]) / clamp_min(rate(http_server_requests_seconds_count{job="noble-loan-backend"}[5m]), 0.001) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High backend 5xx rate"
          description: "More than 2% of backend requests are returning HTTP 5xx responses."

      - alert: NobleLoanHighJvmMemory
        expr: jvm_memory_used_bytes{job="noble-loan-backend",area="heap"} / clamp_min(jvm_memory_max_bytes{job="noble-loan-backend",area="heap"}, 1) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap usage is high"
          description: "JVM heap usage has remained above 90% for 10 minutes."

      - alert: NobleLoanHighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs"} - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs"}) / clamp_min(node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs"}, 1) > 0.85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Production host disk usage is high"
          description: "Root filesystem usage is above 85%; backups and database operations may be at risk."
