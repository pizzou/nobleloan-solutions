global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/loan-saas-alerts.yml

scrape_configs:
  - job_name: noble-loan-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - nobleloan-solutions.onrender.com
    scheme: https
